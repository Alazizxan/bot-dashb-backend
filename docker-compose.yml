version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: bot_postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: bot_backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
    ports:
      - "${PORT}:${PORT}"

volumes:
  pgdata:
